name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  WDK_URL: https://go.microsoft.com/fwlink/p/?LinkID=253170
  LIBUSB0_URL: https://github.com/mcuee/libusb-win32/releases/download/release_1.4.0.0/libusb-win32-bin-1.4.0.0.zip
  LIBUSBK_URL: https://github.com/mcuee/libusbk/releases/download/V3.1.0.0/libusbK-3.1.0.0-bin.7z
  SOLUTION_FILE_PATH: ./libwdi.sln
  BUILD_MACROS: '"WDK_DIR=\"../wdk/Windows Kits/8.0\";LIBUSB0_DIR=\"../libusb0\";LIBUSBK_DIR=\"../libusbk/bin\""'

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download support files
        shell: cmd
        run: |
          curl -L ${{ env.WDK_URL }} -o wdk-redist.msi
          curl -L ${{ env.LIBUSB0_URL }} -o libusb0-redist.zip
          curl -L ${{ env.LIBUSBK_URL }} -o libusbk-redist.7z
          msiexec /a wdk-redist.msi /qn TARGETDIR=%CD%\wdk
          7z x libusb0-redist.zip
          7z x libusbk-redist.7z
          del *.zip
          del *.7z
          move libusb-win32* libusb0
          move libusbK* libusbk

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Zadig (Release Win32)
        shell: cmd
        run: |
          msbuild ${{ env.SOLUTION_FILE_PATH }} /m /p:Configuration=Release,Platform=Win32,PlatformToolset=v143,BuildMacros=${{ env.BUILD_MACROS }}

      - name: Package EDGE USB Helper
        shell: bash
        run: |
          cp -f Win32/Release/examples/zadig.exe EDGE-USB-Helper.exe
          cp -f COPYING COPYING.txt
          sha256sum EDGE-USB-Helper.exe COPYING.txt > SHA256SUMS.txt
          sha256sum EDGE-USB-Helper.exe

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES=$(cat <<'EOF'
          Direct download: [EDGE-USB-Helper.exe](https://github.com/ayshx-ca/edge-usb-helper/releases/latest/download/EDGE-USB-Helper.exe)

          GPLv3 derivative of [Zadig](https://zadig.akeo.ie/) by Pete Batard. Source is this repository. The binary is not code-signed, so Windows SmartScreen may warn — use **More info → Run anyway**.

          Till steps: run as Administrator → Options → List All Devices → pick **GLPrinter80** (not a Qualcomm adapter) → **WinUSB** → Install Driver.
          EOF
          )
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "EDGE USB Helper" --notes "$NOTES"
            gh release upload latest EDGE-USB-Helper.exe COPYING.txt SHA256SUMS.txt --clobber
          else
            gh release create latest \
              EDGE-USB-Helper.exe COPYING.txt SHA256SUMS.txt \
              --title "EDGE USB Helper" \
              --notes "$NOTES" \
              --latest
          fi
